services:
  api:
    build: .
    # Host networking lets the container see the host's ARP table.
    # It only works on Linux hosts; on Docker Desktop, run the API natively instead.
    network_mode: host
    environment:
      NETWATCH_DATABASE_URL: postgresql+psycopg://netwatch:netwatch@localhost:5432/netwatch
      NETWATCH_SCAN_INTERVAL_SECONDS: "300"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netwatch
      POSTGRES_PASSWORD: netwatch
      POSTGRES_DB: netwatch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netwatch"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
